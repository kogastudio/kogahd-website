name: fetch-photos
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/fetch-photos.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect candidates from Pexels
        run: |
          rm -rf _candidates; mkdir -p _candidates
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for q in "modern%20apartment%20building%20exterior" "modern%20residential%20building%20facade" "minimal%20cafe%20interior%20concrete" "modern%20retail%20store%20interior"; do
            tag=$(echo "$q" | tr -d '%20' | cut -c1-12)
            curl -sSL -A "$UA" "https://www.pexels.com/search/${q}/" -o page.html || true
            ids=$(grep -o '/photo/[a-z0-9-]*-[0-9]\{5,9\}/' page.html | grep -o '[0-9]\{5,9\}' | awk '!s[$0]++' | head -12)
            echo "$tag: $ids"
            n=0
            for id in $ids; do
              n=$((n+1))
              curl -sSL -A "$UA" -o "_candidates/${tag}_${n}_${id}.jpg" "https://images.pexels.com/photos/${id}/pexels-photo-${id}.jpeg?auto=compress&cs=tinysrgb&w=900" || true
            done
          done
          ls -la _candidates | head -60
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add _candidates
          git commit -m "chore: 写真候補を取得（一時）" || echo "nothing"
          git push
