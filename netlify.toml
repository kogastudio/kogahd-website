[build]
  publish = "."
  command = "curl -fsSL -o images/business-residence.jpg 'https://images.unsplash.com/photo-1515263487990-61b07816b324?w=1600&q=80&fm=jpg' && curl -fsSL -o images/business-shop.jpg 'https://images.unsplash.com/photo-1479293581560-aee98bb24f7f?w=1600&q=80&fm=jpg' || true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
